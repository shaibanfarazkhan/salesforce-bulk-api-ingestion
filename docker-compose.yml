services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sf_bulk_ingest_api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=sf_ingest_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/sf_ingest_db
      - CLIENT_ID=${CLIENT_ID:-dummy_client_id}
      - CLIENT_SECRET=${CLIENT_SECRET:-dummy_client_secret}
      - LOGIN_URL=${LOGIN_URL:-https://login.salesforce.com}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs

  postgres:
    image: postgres:17-alpine
    container_name: sf_bulk_ingest_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: sf_ingest_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sf_ingest_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
